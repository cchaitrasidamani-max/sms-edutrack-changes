server {
    listen 80;
    server_name _;          # matches any hostname / IP

    root /var/www/sms;
    index index.html;

    # React SPA — all unknown routes fall back to index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy API calls to Spring Boot
    location /api/ {
        proxy_pass         http://127.0.0.1:8082/api/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_connect_timeout 10s;
    }

    # Actuator health endpoint (used by Jenkins health check)
    location /actuator/ {
        proxy_pass         http://127.0.0.1:8082/actuator/;
        proxy_set_header   Host $host;
    }
}
